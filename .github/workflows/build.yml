name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip project
        run: |
          ZIP_FILE=$(ls msf-document-writer*.zip 2>/dev/null | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No msf-document-writer*.zip found!"
            ls -la
            exit 1
          fi

          echo "Using $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found in zip!"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Android project at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Document-Writer-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
