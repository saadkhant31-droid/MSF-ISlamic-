name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle نہیں ملی۔ فائل ریپو میں اپ لوڈ کریں۔"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PDFReader-APK
          path: "**/build/outputs/apk/debug/*.apk"
