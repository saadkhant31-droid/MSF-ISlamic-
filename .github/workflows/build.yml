name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and unzip project
        run: |
          ZIP_FILE="MSF_Gold_Record_App-fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            echo "Files available in repository:"
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Project files:"
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name gradlew

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-Gold-Record-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
